# Hardened Nginx config for AutoPost
# Security headers, block sensitive paths, SSL optimize

server {
    listen 80;
    server_name homelyy.duckdns.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name homelyy.duckdns.org;

    # --- SSL (managed by Certbot) ---
    ssl_certificate /etc/letsencrypt/live/homelyy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homelyy.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- Security ---

    # Hide Nginx version
    server_tokens off;

    # Security headers (backup layer — Next.js also sets these)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upload size limit
    client_max_body_size 100M;

    # --- Block sensitive paths ---

    # Block dotfiles (.env, .git, .gsd, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block direct access to uploads directory
    # Files are served through /api/uploads/ with auth check
    location /uploads {
        deny all;
        return 404;
    }

    # Block node_modules
    location /node_modules {
        deny all;
        return 404;
    }

    # --- Proxy to Next.js ---

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout for AI generation (can take 30s+)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Static files cache (Next.js generated)
    # NOTE: Nginx add_header does NOT inherit from parent blocks when child defines its own.
    # Must repeat security headers here to avoid dropping them on static assets.
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
